name: Publish

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Publish to TestPyPI"
        type: boolean
        default: false
      publish_pypi:
        description: "Publish to PyPI"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Test gate - must pass before building wheels
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test (Ubuntu, Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev libomp-dev

      - name: Install project and dependencies
        run: |
          uv venv
          uv pip install build pytest
          uv pip install .

      - name: Run tests
        run: |
          uv run pytest tests/python -v

  # ─────────────────────────────────────────────────────────────
  # Build wheels for all platforms
  # ─────────────────────────────────────────────────────────────
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y eigen3-devel || apt-get update && apt-get install -y libeigen3-dev
          CIBW_BEFORE_ALL_MACOS: |
            brew install eigen libomp
          CIBW_BEFORE_ALL_WINDOWS: |
            choco install eigen -y
          CIBW_ENVIRONMENT_MACOS: >
            CMAKE_ARGS="-DOpenMP_ROOT=$(brew --prefix libomp)"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # ─────────────────────────────────────────────────────────────
  # Build source distribution
  # ─────────────────────────────────────────────────────────────
  build-sdist:
    name: Build source distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build sdist
        run: |
          uv venv
          uv pip install build
          uv run python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ─────────────────────────────────────────────────────────────
  # Publish to TestPyPI
  # ─────────────────────────────────────────────────────────────
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event.inputs.publish_testpypi == 'true'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dtcc-solar
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List distribution files
        run: ls -la dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ─────────────────────────────────────────────────────────────
  # Publish to PyPI (production)
  # ─────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event.inputs.publish_pypi == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/dtcc-solar
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
